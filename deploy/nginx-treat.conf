# Birthday treat site — nginx reverse proxy
#
# Install:
#   sudo cp deploy/nginx-treat.conf /etc/nginx/sites-available/treat
#   sudo ln -sf /etc/nginx/sites-available/treat /etc/nginx/sites-enabled/treat
#   sudo rm -f /etc/nginx/sites-enabled/default     # frees up port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# On RHEL/CentOS/Alma there is no sites-available; drop it in
# /etc/nginx/conf.d/treat.conf instead.

# Rate-limit the tracking endpoint so nobody can spam your funnel numbers.
limit_req_zone $binary_remote_addr zone=treat_api:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Accessed by IP, so accept any Host header.
    server_name _;

    access_log /var/log/nginx/treat.access.log;
    error_log  /var/log/nginx/treat.error.log;

    client_max_body_size 64k;

    # Don't advertise the nginx version.
    server_tokens off;

    # Basic hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Needed for req.ip to be the visitor, not 127.0.0.1
        # (server.js already sets `app.set('trust proxy', true)`).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Tracking + submissions: rate limited, small burst allowed.
    location ~ ^/api/(event|response)$ {
        limit_req zone=treat_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
